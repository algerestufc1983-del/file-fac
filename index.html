<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الملفات المتاحة للطلبة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1b2538;--muted:#64708a;--brand:#1d4e89;--brand-ink:#fff;--line:#e0e5ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--text:#e8edf8;--muted:#9aa7c2;--brand:#5b9bf0;--brand-ink:#0b1220;--line:#27345a}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--text:#e8edf8;--muted:#9aa7c2;--brand:#5b9bf0;--brand-ink:#0b1220;--line:#27345a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Tajawal",Tahoma,Arial,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 40px}
header{text-align:center;margin-bottom:28px}
.logo{width:240px;max-width:80%;margin:0 auto 14px;border-radius:18px;background:#fff;padding:8px;border:1px solid var(--line)}
.logo img{display:block;width:100%;height:auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0;font-size:15px}
h2{font-size:18px;margin:0 0 12px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.badge{flex:none;min-width:48px;text-align:center;font-size:12px;font-weight:700;padding:6px 8px;border-radius:8px;background:var(--bg);color:var(--brand);border:1px solid var(--line);direction:ltr}
.info{flex:1;min-width:0}
.name{font-weight:500;overflow-wrap:anywhere}
.desc{color:var(--muted);font-size:13px}
.btn{flex:none;background:var(--brand);color:var(--brand-ink);text-decoration:none;font-weight:700;font-size:14px;padding:9px 16px;border-radius:10px}
.btn:hover{opacity:.9}
.folder{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.folder summary{cursor:pointer;padding:14px 16px;font-weight:700;font-size:17px;list-style:none}
.folder summary::-webkit-details-marker{display:none}
.folder summary::after{content:"▾";float:left;color:var(--muted)}
.folder[open] summary{border-bottom:1px solid var(--line)}
.box{display:flex;flex-direction:column;gap:10px;padding:12px}
.box .item{background:var(--bg)}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:28px}
@media (max-width:480px){.item{flex-wrap:wrap}.btn{width:100%;text-align:center}}
</style>
</head>

var dl = null;
try {
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(function (d) { dl = d; }).catch(function () {});
  }
} catch (e) {}

var list = document.getElementById("list");
FOLDERS.forEach(function (folder) {
  var det = document.createElement("details");
  det.className = "folder";
  var sum = document.createElement("summary");
  sum.textContent = "📁 " + folder.name + " (" + folder.files.length + ")";
  det.appendChild(sum);
  var box = document.createElement("div");
  box.className = "box";
  det.appendChild(box);
  list.appendChild(det);
  folder.files.forEach(function (f) {
  var item = document.createElement("div");
  item.className = "item";

  var badge = document.createElement("div");
  badge.className = "badge";
  badge.textContent = f.type;

  var info = document.createElement("div");
  info.className = "info";
  var name = document.createElement("div");
  name.className = "name";
  name.textContent = f.title;
  info.appendChild(name);
  if (f.desc) {
    var d = document.createElement("div");
    d.className = "desc";
    d.textContent = f.desc;
    info.appendChild(d);
  }

  var a = document.createElement("a");
  a.className = "btn";
  a.href = f.url;
  a.download = f.title.replace(/[\\\/:*?"<>|]/g, " ") + "." + f.type.toLowerCase();
  a.rel = "noopener";
  a.textContent = "تحميل";
  a.addEventListener("click", function (e) {
    if (!dl) return;
    e.preventDefault();
    fetch(f.url)
      .then(function (r) { if (!r.ok) throw new Error("fetch"); return r.blob(); })
      .then(function (b) {
        var clean = f.title.replace(/[\\\/:*?"<>|]/g, " ");
        return dl.save({ filename: clean + "." + f.type.toLowerCase(), data: b });
      })
      .catch(function (err) {
        if (!err || err.code !== "declined") window.open(f.url, "_blank");
      });
  });

  item.appendChild(badge);
  item.appendChild(info);
  item.appendChild(a);
  box.appendChild(item);
  });
});
